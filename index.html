<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Diary · 日记</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#000; --panel:#16181c; --border:#2f3336; --text:#e7e9ea; --muted:#71767b;
  --blue:#1d9bf0; --blue-dim:#1a8cd8; --pink:#f91880; --red:#f4212e; --green:#00ba7c;
  --hover:rgba(255,255,255,.04); --input:#202327;
}
html[data-theme="light"]{
  --bg:#fff; --panel:#f7f9f9; --border:#eff3f4; --text:#0f1419; --muted:#536471;
  --hover:rgba(0,0,0,.035); --input:#eff3f4;
}
/* ============ 基础 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;padding:0}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:flex;justify-content:center;min-height:100vh}

/* ---- 左侧栏 ---- */
.sidebar{
  width:275px;flex:0 0 275px;padding:8px 12px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.logo{width:50px;height:50px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--text);margin:2px 0 4px;transition:background .15s}
.logo:hover{background:var(--hover)}
.logo svg{width:28px;height:28px}
.nav-item{
  display:flex;align-items:center;gap:18px;padding:12px;
  border-radius:9999px;font-size:19px;color:var(--text);
  transition:background .15s;width:max-content;max-width:100%;
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{font-weight:700}
.nav-item svg{width:24px;height:24px;flex-shrink:0}
.nav-label{white-space:nowrap}
.compose-btn{
  margin-top:14px;background:var(--blue);color:#fff;font-weight:700;
  font-size:16px;border-radius:9999px;padding:15px 32px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s;box-shadow:0 0 0 0 rgba(29,155,240,.6);
}
.compose-btn:hover{background:var(--blue-dim)}
.sidebar-foot{margin-top:auto;padding:12px 0}
.theme-toggle{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:9999px;font-size:15px;color:var(--muted);width:100%;transition:background .15s}
.theme-toggle:hover{background:var(--hover)}

/* ---- 主区域 ---- */
.main{
  width:600px;flex:0 0 600px;min-height:100vh;
  border-left:1px solid var(--border);border-right:1px solid var(--border);
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:53px}
.topbar h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.topbar p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:400}
.icon-btn{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text);transition:background .15s;flex-shrink:0;font-size:16px;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn.sm{width:32px;height:32px;font-size:14px}

/* ---- 那年今日横幅 ---- */
.otd-banner{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(29,155,240,.12),rgba(249,24,128,.08));
  transition:background .15s;
}
.otd-banner:hover{background:linear-gradient(90deg,rgba(29,155,240,.2),rgba(249,24,128,.14))}
.otd-emoji{font-size:24px}
.otd-banner strong{display:block;font-size:15px}
.otd-sub{font-size:13px;color:var(--muted);margin-top:1px}
.otd-arrow{margin-left:auto;color:var(--muted);font-size:18px}

/* ---- 日期分隔 ---- */
.day-sep,.year-sep{
  display:flex;align-items:center;gap:10px;padding:14px 16px 8px;
  font-size:13px;font-weight:700;color:var(--muted);
}
.day-sep .line{flex:1;height:1px;background:var(--border)}
.day-sep .count{font-weight:400;font-size:12px}
.year-sep{background:var(--panel);padding:10px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.year-sep em{margin-left:auto;font-style:normal;font-size:12px;color:var(--blue);font-weight:600}

/* ---- 日记卡片 ---- */
.entry{
  display:flex;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);transition:background .15s;
}
.entry:hover{background:var(--hover)}
.avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--input);
}
.entry-body{flex:1;min-width:0}
.entry-head{display:flex;align-items:center;gap:6px;font-size:15px;flex-wrap:wrap}
.entry-name{font-weight:700}
.entry-weather{font-size:14px}
.entry-time{color:var(--muted);font-weight:400;font-size:14px}
.entry-text{
  margin-top:3px;white-space:pre-wrap;word-break:break-word;
  font-size:15px;line-height:1.6;
}
.entry-text.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{color:var(--blue);font-size:14px;margin-top:4px;font-weight:500}
.entry-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{color:var(--blue);font-size:14px}
.tag:hover{text-decoration:underline}

.image-grid{
  display:grid;gap:3px;margin-top:10px;border-radius:16px;overflow:hidden;
  border:1px solid var(--border);
}
.image-grid[data-count="1"]{grid-template-columns:1fr}
.image-grid[data-count="2"]{grid-template-columns:1fr 1fr}
.image-grid[data-count="3"]{grid-template-columns:1fr 1fr 1fr}
.image-grid[data-count="4"]{grid-template-columns:1fr 1fr}
.image-grid img{width:100%;height:100%;object-fit:cover;display:block;min-height:110px;max-height:300px}

.entry-actions{display:flex;gap:4px;margin-top:10px;margin-left:-8px;color:var(--muted)}
.act{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;
  font-size:13px;transition:.15s;color:var(--muted)}
.act svg{width:17px;height:17px}
.act.fav:hover{color:var(--pink);background:rgba(249,24,128,.12)}
.act.fav.on{color:var(--pink)}
.act.edit:hover{color:var(--blue);background:rgba(29,155,240,.12)}
.act.del:hover{color:var(--red);background:rgba(244,33,46,.12)}

/* ---- 空状态 ---- */
.empty{padding:60px 32px;text-align:center;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty h3{margin:0 0 6px;color:var(--text);font-size:19px}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.6}
.btn-primary{background:var(--blue);color:#fff;font-weight:700;padding:11px 24px;
  border-radius:9999px;font-size:15px;transition:background .15s}
.btn-primary:hover{background:var(--blue-dim)}
.empty-mini{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ---- 日历 ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:16px}
.cal-head strong{font-size:17px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 6px;text-align:center;
  font-size:12px;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 8px 16px}
.cal-cell{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:14px;
  cursor:pointer;transition:background .15s;position:relative;
}
.cal-cell.empty{cursor:default}
.cal-cell:not(.empty):hover{background:var(--hover)}
.cal-cell.has{font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue)}
.cal-cell.sel{background:var(--blue);color:#fff}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}
.cal-cell.sel .dot{background:#fff}

/* ---- 搜索 ---- */
.search-wrap{padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:53px;
  background:var(--bg);z-index:15}
.search-box{display:flex;align-items:center;gap:10px;background:var(--input);
  border-radius:9999px;padding:10px 16px;border:1px solid transparent;transition:border-color .15s}
.search-box:focus-within{border-color:var(--blue);background:transparent}
.search-box svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search-box input{flex:1;background:none;border:none;outline:none;font-size:15px;min-width:0}

/* ---- 统计 ---- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.stat-card{background:var(--panel);border-radius:16px;padding:16px;border:1px solid var(--border)}
.stat-card .num{font-size:26px;font-weight:800;line-height:1.2}
.stat-card .lbl{font-size:13px;color:var(--muted);margin-top:2px}
.mood-bars{padding:0 16px 24px}
.mood-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.mood-bar .name{width:64px;flex-shrink:0;color:var(--muted)}
.mood-bar .track{flex:1;height:10px;background:var(--input);border-radius:9999px;overflow:hidden}
.mood-bar .fill{height:100%;border-radius:9999px;transition:width .5s ease}
.mood-bar .val{width:28px;text-align:right;color:var(--muted);font-size:13px}

/* ---- 右侧栏 ---- */
.rightbar{width:350px;flex:0 0 350px;padding:12px 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.card{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:800}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--muted)}
.stat-row strong{color:var(--text)}
.otd-mini{cursor:pointer;border-radius:12px;padding:10px;margin:-6px;transition:background .15s}
.otd-mini:hover{background:var(--hover)}
.otd-mini strong{font-size:14px}
.otd-mini p{margin:4px 0 0;font-size:13px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-chip{background:var(--input);color:var(--blue);padding:5px 12px;border-radius:9999px;
  font-size:13px;transition:.15s}
.tag-chip:hover{background:rgba(29,155,240,.15)}
.footer-links{color:var(--muted);font-size:12px;line-height:1.8;padding:0 8px}

/* ---- 底部导航（移动端） ---- */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;height:54px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);z-index:60;
  padding-bottom:env(safe-area-inset-bottom);
  align-items:center;justify-content:space-around;
}
.bnav-item{display:flex;align-items:center;justify-content:center;width:56px;height:48px;
  border-radius:9999px;color:var(--muted);transition:.15s}
.bnav-item.active{color:var(--text)}
.bnav-item svg{width:24px;height:24px}
.bnav-compose{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:300}

/* ---- 编辑弹窗 ---- */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(91,112,131,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-root[hidden]{display:none}
.composer-panel{
  background:var(--bg);width:min(600px,100%);max-height:88vh;
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-weight:700;font-size:16px;flex:1}
.post-btn{background:var(--blue);color:#fff;font-weight:700;padding:8px 18px;
  border-radius:9999px;font-size:15px;transition:.15s}
.post-btn:disabled{opacity:.4;cursor:not-allowed}
.post-btn:not(:disabled):hover{background:var(--blue-dim)}
.composer-scroll{overflow-y:auto;flex:1;padding:14px 16px}
.composer-row{display:flex;gap:12px}
.composer-col{flex:1;min-width:0}
.composer-input{
  width:100%;background:none;border:none;outline:none;resize:none;
  font-size:19px;line-height:1.5;min-height:100px;padding-top:6px;
}
.composer-input::placeholder{color:var(--muted)}
.composer-tools{
  display:flex;align-items:center;gap:4px;padding:10px 14px;
  border-top:1px solid var(--border);flex-shrink:0;
}
.tool{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:.15s;color:var(--blue)}
.tool:hover{background:rgba(29,155,240,.12)}
.tool.active{background:rgba(29,155,240,.18)}
.counter{margin-left:auto;font-size:13px;color:var(--muted);padding-right:6px}
.tool-panel{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;max-height:200px;overflow-y:auto}
.mood-grid{display:flex;flex-wrap:wrap;gap:6px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;
  border-radius:12px;font-size:20px;transition:.15s;min-width:60px}
.mood-btn small{font-size:11px;color:var(--muted)}
.mood-btn:hover{background:var(--hover)}
.mood-btn.active{background:rgba(29,155,240,.15);box-shadow:inset 0 0 0 1.5px var(--blue)}
.mood-btn.active small{color:var(--blue)}
.tag-input{width:100%;background:var(--input);border:none;outline:none;
  border-radius:10px;padding:10px 14px;font-size:14px}
.img-thumb{position:relative;aspect-ratio:1;overflow:hidden;background:var(--input)}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.75);color:#fff;font-size:13px;display:flex;
  align-items:center;justify-content:center}

/* ---- Toast ---- */
.toast{
  position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);
  background:var(--blue);color:#fff;padding:11px 22px;border-radius:9999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media(max-width:1280px){ .rightbar{display:none} }
@media(max-width:1000px){
  .sidebar{width:88px;flex:0 0 88px;align-items:center;padding:8px}
  .nav-label,.compose-btn span{display:none}
  .nav-item{gap:0;padding:12px}
  .compose-btn{width:52px;height:52px;padding:0;border-radius:50%}
  .sidebar-foot{width:100%}
  .theme-toggle{justify-content:center;padding:12px}
  .theme-toggle span{display:none}
}
@media(max-width:700px){
  .sidebar{display:none}
  .main{width:100%;flex:1 1 auto;border-left:none;border-right:none}
  .bottom-nav{display:flex}
  body{padding-bottom:calc(54px + env(safe-area-inset-bottom))}
  .composer-panel{border-radius:18px 18px 0 0;max-height:92vh}
  .modal-root{align-items:flex-end}
  .entry{padding:12px 14px}
  .avatar{width:40px;height:40px;font-size:18px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
  <aside class="rightbar" id="rightbar"></aside>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   常量
   ========================================================= */
const STORE_KEY = 'diary_app_v1';

const MOODS = [
  {id:'happy',   emoji:'😄', label:'开心', color:'#FFD400'},
  {id:'love',    emoji:'🥰', label:'幸福', color:'#F91880'},
  {id:'calm',    emoji:'😌', label:'平静', color:'#00BA7C'},
  {id:'excited', emoji:'🤩', label:'兴奋', color:'#7856FF'},
  {id:'tired',   emoji:'😮‍💨', label:'疲惫', color:'#8B98A5'},
  {id:'sad',     emoji:'😔', label:'难过', color:'#1D9BF0'},
  {id:'angry',   emoji:'😤', label:'生气', color:'#FF7A00'},
  {id:'anxious', emoji:'😰', label:'焦虑', color:'#C084FC'},
];
const WEATHERS = [
  {id:'sunny',  emoji:'☀️', label:'晴'},
  {id:'cloudy', emoji:'⛅', label:'多云'},
  {id:'rain',   emoji:'🌧️', label:'雨'},
  {id:'storm',  emoji:'⛈️', label:'雷雨'},
  {id:'snow',   emoji:'❄️', label:'雪'},
  {id:'fog',    emoji:'🌫️', label:'雾'},
  {id:'wind',   emoji:'🌬️', label:'大风'},
];
const VIEWS = [
  {id:'timeline',  label:'时间线',   icon:'home'},
  {id:'otd',       label:'那年今日', icon:'clock'},
  {id:'calendar',  label:'日历',     icon:'calendar'},
  {id:'favorites', label:'收藏',     icon:'heart'},
  {id:'search',    label:'搜索',     icon:'search'},
  {id:'stats',     label:'我的',     icon:'user'},
];
const ICONS = {
  home:'<path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z"/><path d="M9 21.5v-8h6v8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/>',
  calendar:'<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>',
  heart:'<path d="M20.8 5.1a5.4 5.4 0 0 0-7.7 0L12 6.2l-1.1-1.1a5.4 5.4 0 1 0-7.7 7.7l8.8 8.8 8.8-8.8a5.4 5.4 0 0 0 0-7.7z"/>',
  search:'<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
  user:'<path d="M20 21v-1.8a4.2 4.2 0 0 0-4.2-4.2H8.2A4.2 4.2 0 0 0 4 19.2V21"/><circle cx="12" cy="7.5" r="4"/>',
  feather:'<path d="M20.2 12.2a6 6 0 0 0-8.5-8.5L5 10.5V19h8.5z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/>',
  star:'<path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.4l6.5-.9z"/>',
  edit:'<path d="M11 4H4.5A1.5 1.5 0 0 0 3 5.5v14A1.5 1.5 0 0 0 4.5 21h14a1.5 1.5 0 0 0 1.5-1.5V13"/><path d="M18.4 2.6a2 2 0 0 1 2.8 2.8L12 14.6l-3.5.7.7-3.5z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6"/><path d="M19 6v13.5A1.5 1.5 0 0 1 17.5 21h-11A1.5 1.5 0 0 1 5 19.5V6"/>',

function svgIcon(name, size=24){

/* =========================================================
   工具函数
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function timeAgo(iso){
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
  if (diff < 86400*7) return `${Math.floor(diff/86400)}天前`;
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function dayLabel(k){
  const [y,m,d] = k.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const now = new Date();
  const yest = new Date(now); yest.setDate(yest.getDate()-1);
  if (k === dateKey(now)) return '今天';
  if (k === dateKey(yest)) return '昨天';
  const wk = '日一二三四五六'[dt.getDay()];
  if (y === now.getFullYear()) return `${m}月${d}日 周${wk}`;
  return `${y}年${m}月${d}日 周${wk}`;
}

/* =========================================================
   存储
   ========================================================= */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const d = JSON.parse(raw);
      entries = Array.isArray(d.entries) ? d.entries : [];
      if (d.theme) ui.theme = d.theme;
    }
  }catch(err){ console.warn('读取失败', err); }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ entries, theme: ui.theme }));
  }catch(err){
    toast('本地存储空间不足，请删除部分带图片的日记');
  }
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   计算类
   ========================================================= */
function getOnThisDay(){
  const now = new Date();
  const m = now.getMonth()+1, d = now.getDate(), y = now.getFullYear();
  return entries.filter(e => {
    const dt = new Date(e.createdAt);
    return dt.getMonth()+1 === m && dt.getDate() === d && dt.getFullYear() !== y;
  }).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}
function otdText(list){
  const nowY = new Date().getFullYear();
  const years = [...new Set(list.map(e => new Date(e.createdAt).getFullYear()))]
    .sort((a,b) => b - a);
  return `${years.map(y => (nowY - y) + '年前').join('、')}的今天，你写了 ${list.length} 篇日记`;
}
function calcStreak(){
  const keys = new Set(entries.map(e => dateKey(new Date(e.createdAt))));
  if (!keys.size) return 0;
  let streak = 0;
  const d = new Date();
  if (!keys.has(dateKey(d))) d.setDate(d.getDate() - 1);
  while (keys.has(dateKey(d))){ streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function calcLongest(){
  const days = [...new Set(entries.map(e => dateKey(new Date(e.createdAt))))].sort();
  let best = 0, cur = 0, prev = null;
  for (const k of days){
    const d = new Date(k + 'T00:00:00');
    if (prev && (d - prev) === 86400000) cur++; else cur = 1;
    prev = d;
    best = Math.max(best, cur);
  }
  return best;
}

function topbar(title, sub){

/* ---------- 时间线 ---------- */
function viewTimeline(){
  const list = entries.slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const otd = getOnThisDay();

  let html = topbar('时间线', entries.length ? `共 ${entries.length} 篇日记` : '');

  if (otd.length){
    html += `<div class="otd-banner" data-view="otd">
      <span class="otd-emoji">🕰️</span>
      <div>
        <strong>那年今日</strong>
        <div class="otd-sub">${otdText(otd)}</div>
      </div>
      <span class="otd-arrow">→</span>
    </div>`;
  }

  if (!list.length){
    return html + emptyState('还没有日记', '记录下此刻的心情，明年的今天它会重新回到你眼前 ✍️');
  }

  const groups = new Map();
  for (const e of list){
    const k = dateKey(new Date(e.createdAt));
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }

  for (const [k, items] of groups){
    html += `<div class="day-sep">
      <span>${dayLabel(k)}</span>
      <div class="line"></div>
      <span class="count">${items.length} 篇</span>
    </div>`;
    html += items.map(entryCard).join('');
  }
  return html;
}

/* ---------- 那年今日 ---------- */
function viewOTD(){
  const list = getOnThisDay();
  let html = topbar('那年今日', '同月同日，不同年份');

  if (!list.length){
    return html + emptyState('还没有往年今日的记录', '从今天开始写日记，明年的今天它就会出现在这里 📅');
  }

  const nowY = new Date().getFullYear();
  const groups = new Map();
  for (const e of list){
    const y = new Date(e.createdAt).getFullYear();
    if (!groups.has(y)) groups.set(y, []);
    groups.get(y).push(e);
  }

  for (const [y, items] of [...groups.entries()].sort((a,b) => b[0] - a[0])){
    html += `<div class="year-sep"><span>${y}年</span><em>${nowY - y} 年前</em></div>`;
    html += items.map(entryCard).join('');
  }
  return html;
}

/* ---------- 收藏 ---------- */
function viewFavorites(){
  const list = entries
    .filter(e => e.favorite)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  let html = topbar('收藏', list.length ? `${list.length} 篇` : '');
  if (!list.length){
    return html + emptyState('还没有收藏的日记', '点击日记右下角的心形图标即可收藏 ❤️');

/* ---------- 搜索 ---------- */
function viewSearch(){
  return `${topbar('搜索')}
    <div class="search-wrap">
      <div class="search-box">
        ${svgIcon('search', 18)}

      </div>
    </div>
    <div id="searchResults">${searchResultsHTML()}</div>`;
}
function searchResultsHTML(){
  const q = ui.query.trim().toLowerCase();
  if (!q) return `<div class="empty-mini">输入关键词开始搜索 🔍</div>`;
  const list = entries.filter(e =>
    (e.content || '').toLowerCase().includes(q) ||
    (e.tags || []).some(t => t.toLowerCase().includes(q))
  ).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  if (!list.length) return `<div class="empty-mini">没有找到相关日记</div>`;
  return `<div class="day-sep"><span>找到 ${list.length} 篇</span><div class="line"></div></div>`
    + list.map(entryCard).join('');
}

/* ---------- 日历 ---------- */
function viewCalendar(){
  const cur = ui.calCursor;
  const y = cur.getFullYear(), m = cur.getMonth();
  const startDow = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();

  const counts = {};
  entries.forEach(e => {
    const k = dateKey(new Date(e.createdAt));
    counts[k] = (counts[k] || 0) + 1;
  });

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= days; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    const c = counts[k] || 0;
    const cls = [
      'cal-cell',
      c ? 'has' : '',
      k === dateKey(new Date()) ? 'today' : '',
      ui.selectedDay === k ? 'sel' : '',
    ].filter(Boolean).join(' ');
    cells += `<div class="${cls}" data-act="cal-day" data-day="${k}">
      <span>${d}</span>${c ? '<i class="dot"></i>' : ''}
    </div>`;
  }

  let html = topbar('日历', '点击日期查看当天日记');
  html += `<div class="cal-head">
    <button class="icon-btn" data-act="cal-prev">‹</button>
    <strong>${y} 年 ${m+1} 月</strong>
    <button class="icon-btn" data-act="cal-next">›</button>
  </div>
  <div class="cal-week">${['日','一','二','三','四','五','六'].map(d => `<span>${d}</span>`).join('')}</div>
  <div class="cal-grid">${cells}</div>`;

  if (ui.selectedDay){
    const items = entries
      .filter(e => dateKey(new Date(e.createdAt)) === ui.selectedDay)
      .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    html += `<div class="day-sep">
      <span>${dayLabel(ui.selectedDay)}</span><div class="line"></div>
      <span class="count">${items.length} 篇</span></div>`;
    html += items.length
      ? items.map(entryCard).join('')
      : `<div class="empty-mini">这一天没有日记</div>`;
  } else {
    html += `<div class="empty-mini">点击上方日期查看当天日记</div>`;
  }
  return html;
}

/* ---------- 统计 ---------- */
function viewStats(){
  const total = entries.length;
  const daysCount = new Set(entries.map(e => dateKey(new Date(e.createdAt)))).size;
  const streak = calcStreak();
  const longest = calcLongest();
  const words = entries.reduce((s,e) => s + (e.content || '').length, 0);
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const monthCount = entries.filter(e => dateKey(new Date(e.createdAt)).startsWith(monthPrefix)).length;
  const imgCount = entries.reduce((s,e) => s + (e.images || []).length, 0);

  const moodCount = {};
  entries.forEach(e => { if (e.mood) moodCount[e.mood] = (moodCount[e.mood]||0) + 1; });
  const moodTotal = Math.max(1, ...Object.values(moodCount));

  let html = topbar('我的', '记录是一种生活方式');
  html += `<div class="stat-grid">
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总篇数</div></div>
    <div class="stat-card"><div class="num">${daysCount}</div><div class="lbl">记录天数</div></div>
    <div class="stat-card"><div class="num">${streak}<span style="font-size:14px"> 天</span></div><div class="lbl">当前连续</div></div>
    <div class="stat-card"><div class="num">${longest}<span style="font-size:14px"> 天</span></div><div class="lbl">最长连续</div></div>
    <div class="stat-card"><div class="num">${monthCount}</div><div class="lbl">本月记录</div></div>
    <div class="stat-card"><div class="num">${words}</div><div class="lbl">累计字数</div></div>
  </div>`;

  if (Object.keys(moodCount).length){
    html += `<div class="day-sep"><span>心情分布</span><div class="line"></div></div>
      <div class="mood-bars">`;
    MOODS.filter(m => moodCount[m.id]).sort((a,b) => moodCount[b.id] - moodCount[a.id]).forEach(m => {
      const pct = Math.round(moodCount[m.id] / moodTotal * 100);
      html += `<div class="mood-bar">
        <span class="name">${m.emoji} ${m.label}</span>
        <div class="track"><div class="fill" style="width:${pct}%;background:${m.color}"></div></div>
        <span class="val">${moodCount[m.id]}</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="day-sep"><span>数据管理</span><div class="line"></div></div>
    <div style="padding:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn-primary" data-act="export">导出备份</button>
      <button class="btn-primary" style="background:var(--input);color:var(--text)" data-act="import">导入备份</button>
      <button class="btn-primary" style="background:rgba(244,33,46,.15);color:var(--red)" data-act="clear-all">清空全部</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div style="padding:0 16px 40px;color:var(--muted);font-size:12px;line-height:1.8">
      共 ${imgCount} 张图片 · 数据仅保存在本机浏览器中
    </div>`;
  return html;
}

/* =========================================================
   日记卡片
   ========================================================= */
function entryCard(e){
  const dt = new Date(e.createdAt);
  const mood = MOODS.find(m => m.id === e.mood);
  const weather = WEATHERS.find(w => w.id === e.weather);
  const time = `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  const isLong = (e.content || '').length > 320;

  const avatarStyle = mood
    ? `background:${mood.color}22;`
    : '';

  return `<article class="entry" data-id="${e.id}">
    <div class="avatar" style="${avatarStyle}">${mood ? mood.emoji : '📝'}</div>
    <div class="entry-body">
      <div class="entry-head">
        <span class="entry-name">${mood ? mood.label : '日记'}</span>
        ${weather ? `<span class="entry-weather">${weather.emoji}</span>` : ''}
        <span class="entry-time">· ${time}</span>
        ${e.updatedAt && e.updatedAt !== e.createdAt ? `<span class="entry-time">· 已编辑</span>` : ''}
      </div>

      ${e.content ? `<div class="entry-text ${isLong ? 'clamp' : ''}">${esc(e.content)}</div>` : ''}
      ${isLong ? `<button class="more-btn" data-act="expand">展开全文</button>` : ''}

      ${(e.images && e.images.length) ? `
        <div class="image-grid" data-count="${Math.min(e.images.length,4)}">
          ${e.images.slice(0,4).map(src => `<img src="${src}" loading="lazy" alt="">`).join('')}
        </div>` : ''}

      ${(e.tags && e.tags.length) ? `
        <div class="entry-tags">
          ${e.tags.map(t => `<button class="tag" data-act="tag-search" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}
        </div>` : ''}

      <div class="entry-actions">
        <button class="act fav ${e.favorite ? 'on' : ''}" data-act="fav" title="收藏">
          ${svgIcon('heart', 17)}<span>${e.favorite ? '已收藏' : '收藏'}</span>
        </button>
        <button class="act edit" data-act="edit" title="编辑">
          ${svgIcon('edit', 17)}<span>编辑</span>
        </button>
        <button class="act del" data-act="del" title="删除">
          ${svgIcon('trash', 17)}<span>删除</span>
        </button>
      </div>
    </div>
  </article>`;
}

function emptyState(title = '还没有日记', desc = '', btn = true){
  return `<div class="empty">
    <div class="empty-icon">📖</div>
    <h3>${title}</h3>
    ${desc ? `<p>${desc}</p>` : ''}
    ${btn ? `<button class="btn-primary" data-act="compose">写一篇日记</button>` : ''}
  </div>`;
}

/* =========================================================
   编辑器
   ========================================================= */
function openComposer(id = null){
  if (id){
    const e = entries.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    draft = {
      content: e.content || '',
      mood: e.mood || null,
      weather: e.weather || null,
      tags: [...(e.tags || [])],
      images: [...(e.images || [])],
    };
  } else {
    editingId = null;
    draft = { content:'', mood:null, weather:null, tags:[], images:[] };
  }
  renderComposer();
  document.getElementById('modalRoot').hidden = false;
  document.body.style.overflow = 'hidden';

  const ta = document.getElementById('contentInput');
  if (ta){
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    autoGrow(ta);
  }
  updatePublishState();
}

function closeComposer(){
  document.getElementById('modalRoot').hidden = true;
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
  editingId = null;
  draft = null;
}

function renderComposer(){
  const root = document.getElementById('modalRoot');
  const mood = MOODS.find(m => m.id === draft.mood);

  root.innerHTML = `<div class="composer-panel" role="dialog" aria-modal="true">
    <div class="modal-head">
      <button class="icon-btn" data-act="close">✕</button>
      <span class="modal-title">${editingId ? '编辑日记' : '新的日记'}</span>
      <button class="post-btn" id="publishBtn" data-act="publish" disabled>
        ${editingId ? '保存' : '发布'}
      </button>
    </div>

    <div class="composer-scroll">
      <div class="composer-row">
        <div class="avatar" id="composerAvatar" style="${mood ? `background:${mood.color}22;` : ''}">
          ${mood ? mood.emoji : '📝'}
        </div>
        <div class="composer-col">
          <textarea id="contentInput" class="composer-input"
            placeholder="今天发生了什么？">${esc(draft.content)}</textarea>
          <div class="image-grid" id="draftImages" style="display:none"></div>
        </div>
      </div>
    </div>

    <div class="tool-panel" id="panel-mood" hidden>
      <div class="mood-grid">
        ${MOODS.map(m => `<button class="mood-btn ${draft.mood===m.id?'active':''}" data-act="mood" data-mood="${m.id}">
          <span>${m.emoji}</span><small>${m.label}</small>
        </button>`).join('')}
      </div>
    </div>

    <div class="tool-panel" id="panel-weather" hidden>
      <div class="mood-grid">
        ${WEATHERS.map(w => `<button class="mood-btn ${draft.weather===w.id?'active':''}" data-act="weather" data-weather="${w.id}">
          <span>${w.emoji}</span><small>${w.label}</small>
        </button>`).join('')}
      </div>
    </div>

    <div class="tool-panel" id="panel-tags" hidden>
      <input class="tag-input" id="tagInput" placeholder="用逗号或空格分隔，如：生活 读书 旅行"
        value="${esc(draft.tags.join(' '))}">
    </div>

    <div class="composer-tools">
      <button class="tool" data-act="toggle-panel" data-panel="mood" title="心情">😊</button>
      <button class="tool" data-act="toggle-panel" data-panel="weather" title="天气">☀️</button>
      <button class="tool" data-act="toggle-panel" data-panel="tags" title="标签">${svgIcon('tag', 18)}</button>
      <button class="tool" data-act="pick-image" title="图片">${svgIcon('image', 18)}</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <span class="counter" id="counter">0</span>
    </div>
  </div>`;

  // textarea 自动增高 + 实时同步
  const ta = document.getElementById('contentInput');
  ta.addEventListener('input', () => {
    draft.content = ta.value;
    autoGrow(ta);
    updatePublishState();
  });
  ta.addEventListener('keydown', ev => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter'){ ev.preventDefault(); publish(); }
  });

  // 标签输入
  const tagInput = document.getElementById('tagInput');
  tagInput.addEventListener('input', () => {
    draft.tags = tagInput.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean).slice(0, 10);
  });

  // 图片选择
  document.getElementById('fileInput').addEventListener('change', async ev => {
    await handleFiles(ev.target.files);
    ev.target.value = '';
  });

  renderDraftImages();
  updatePublishState();
}

function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.max(100, ta.scrollHeight) + 'px';
}

function updatePublishState(){
  const btn = document.getElementById('publishBtn');
  if (!btn || !draft) return;
  const ok = draft.content.trim().length > 0 || draft.images.length > 0;
  btn.disabled = !ok;
  const counter = document.getElementById('counter');
  if (counter) counter.textContent = draft.content.length;
}

function renderDraftImages(){
  const grid = document.getElementById('draftImages');
  if (!grid || !draft) return;
  if (!draft.images.length){ grid.style.display = 'none'; grid.innerHTML = ''; return; }
  grid.style.display = 'grid';
  grid.dataset.count = Math.min(draft.images.length, 4);
  grid.innerHTML = draft.images.map((src, i) => `
    <div class="img-thumb">
      <img src="${src}" alt="">
      <button class="img-del" data-act="img-del" data-i="${i}">✕</button>
    </div>`).join('');
}

/* 图片压缩，避免 localStorage 爆掉 */
function compressImage(file, maxSize = 900, quality = 0.72){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxSize || h > maxSize){
          if (w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(null);
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function handleFiles(files){
  if (!files || !files.length) return;
  const remain = 4 - draft.images.length;
  if (remain <= 0){ toast('最多添加 4 张图片'); return; }
  const list = [...files].slice(0, remain);
  toast('处理图片中…');
  for (const f of list){
    const data = await compressImage(f);
    if (data) draft.images.push(data);
  }
  renderDraftImages();
  updatePublishState();
}

/* =========================================================
   发布 / 编辑 / 删除
   ========================================================= */
function publish(){
  if (!draft) return;
  const content = draft.content.trim();
  if (!content && !draft.images.length) return;

  if (editingId){
    const e = entries.find(x => x.id === editingId);
    if (e){
      Object.assign(e, {
        content,
        mood: draft.mood,
        weather: draft.weather,
        tags: draft.tags,
        images: draft.images,
        updatedAt: new Date().toISOString(),
      });
    }
    toast('已保存修改');
  } else {
    const now = new Date().toISOString();
    entries.push({
      id: uid(),
      content,
      mood: draft.mood,
      weather: draft.weather,
      tags: draft.tags,
      images: draft.images,
      favorite: false,
      createdAt: now,
      updatedAt: now,
    });
    toast('日记已发布 ✨');
  }
  save();
  closeComposer();
  render();
}

/* =========================================================
   事件处理
   ========================================================= */
document.addEventListener('click', ev => {
  const actEl = ev.target.closest('[data-act]');
  const viewEl = ev.target.closest('[data-view]');
  const entryEl = ev.target.closest('[data-id]');
  const id = entryEl ? entryEl.dataset.id : null;

  if (actEl){
    const act = actEl.dataset.act;
    // 搜索框点击 → 进入搜索视图
    if (act === 'goto-search'){ setView('search'); return; }

    switch (act){
      case 'theme':
        ui.theme = ui.theme === 'dark' ? 'light' : 'dark';
        save(); render();
        return;

      case 'compose':
        openComposer(null);
        return;

      case 'close':
        closeComposer();
        return;

      case 'publish':
        publish();
        return;

      case 'mood':
        draft.mood = draft.mood === actEl.dataset.mood ? null : actEl.dataset.mood;
        renderComposer();
        return;

      case 'weather':
        draft.weather = draft.weather === actEl.dataset.weather ? null : actEl.dataset.weather;
        renderComposer();
        return;

      case 'toggle-panel': {
        const name = actEl.dataset.panel;
        const panel = document.getElementById('panel-' + name);
        const isOpen = panel && !panel.hidden;
        ['mood','weather','tags'].forEach(n => {
          const p = document.getElementById('panel-' + n);
          if (p) p.hidden = true;
        });
        document.querySelectorAll('.tool').forEach(t => t.classList.remove('active'));
        if (!isOpen && panel){
          panel.hidden = false;
          actEl.classList.add('active');
          if (name === 'tags'){
            const ti = document.getElementById('tagInput');
            if (ti) ti.focus();
          }
        }
        return;
      }

      case 'pick-image':
        document.getElementById('fileInput').click();
        return;

      case 'img-del': {
        const i = Number(actEl.dataset.i);
        draft.images.splice(i, 1);
        renderDraftImages();
        updatePublishState();
        return;
      }

      case 'fav': {
        const e = entries.find(x => x.id === id);
        if (e){
          e.favorite = !e.favorite;
          save();
          renderMain();
          toast(e.favorite ? '已加入收藏 ❤️' : '已取消收藏');
        }
        return;
      }

      case 'edit':
        openComposer(id);
        return;

      case 'del': {
        const e = entries.find(x => x.id === id);
        if (!e) return;
        if (confirm('确定要删除这篇日记吗？此操作不可恢复。')){
          entries = entries.filter(x => x.id !== id);
          save(); render();
          toast('已删除');
        }
        return;
      }

      case 'expand': {
        const textEl = actEl.parentElement.querySelector('.entry-text');
        if (textEl){
          textEl.classList.remove('clamp');
          actEl.remove();
        }
        return;
      }

      case 'tag-search':
        ui.query = actEl.dataset.tag || '';
        setView('search');
        return;

      case 'cal-prev':
        ui.calCursor = new Date(ui.calCursor.getFullYear(), ui.calCursor.getMonth() - 1, 1);
        renderMain();
        return;

      case 'cal-next':
        ui.calCursor = new Date(ui.calCursor.getFullYear(), ui.calCursor.getMonth() + 1, 1);
        renderMain();
        return;

      case 'cal-day':
        ui.selectedDay = ui.selectedDay === actEl.dataset.day ? null : actEl.dataset.day;
        renderMain();
        return;

      case 'export':
        exportData();
        return;

      case 'import':
        document.getElementById('importFile').click();
        return;

      case 'clear-all':
        if (confirm('确定清空全部日记？此操作不可恢复！')){
          entries = [];
          save(); render();
          toast('已清空');
        }
        return;
    }
  }

  if (viewEl && !actEl){
    setView(viewEl.dataset.view);
  }
});

/* 搜索输入实时过滤 */
document.addEventListener('input', ev => {
  if (ev.target.id === 'searchInput'){
    ui.query = ev.target.value;
    const box = document.getElementById('searchResults');
    if (box) box.innerHTML = searchResultsHTML();
  }
});

/* 点击遮罩关闭弹窗 */
document.getElementById('modalRoot').addEventListener('mousedown', ev => {
  if (ev.target.id === 'modalRoot') closeComposer();
});

/* ESC 关闭 */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !document.getElementById('modalRoot').hidden) closeComposer();
});

/* 导入文件 */
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile') return;
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : data.entries;
      if (!Array.isArray(list)) throw new Error('格式错误');
      const valid = list.filter(x => x && x.id && x.createdAt);
      if (!valid.length) throw new Error('没有有效数据');
      if (confirm(`导入 ${valid.length} 篇日记？现有数据将被合并。`)){
        const ids = new Set(entries.map(e => e.id));
        valid.forEach(e => { if (!ids.has(e.id)) entries.push(e); });
        save(); render();
        toast(`已导入 ${valid.length} 篇`);
      }
    }catch(err){
      toast('导入失败：文件格式不正确');
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
});

/* =========================================================
   数据导入导出
   ========================================================= */
function exportData(){
  const data = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), entries }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `diary-backup-${dateKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('备份已导出');
}

/* =========================================================
   视图切换
   ========================================================= */
function setView(v){
  ui.view = v;
  if (v !== 'search') ui.query = '';
  if (v === 'calendar') ui.calCursor = new Date();
  render();
}

/* =========================================================
   启动
   ========================================================= */
function init(){
  load();
  document.documentElement.dataset.theme = ui.theme;
  render();

  // 首次使用引导
  if (!entries.length){
    setTimeout(() => {
      toast('点击「写日记」开始记录 ✍️');
    }, 600);
  }
}
init();
</script>
